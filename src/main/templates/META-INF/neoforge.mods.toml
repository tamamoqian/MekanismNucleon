modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}(es)"
    displayName="${mod_name}"
    description='''
    Mekanism: Nucleon description.
    '''

[[mixins]]
    config="meknuc.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.meknuc]]
    modId="mekanism"
    type="required"
    versionRange="[10.7.19,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.meknuc]]
    modId="mekanismgenerators"
    type="required"
    versionRange="[10.7.19,)"
    ordering="AFTER"
    side="BOTH"